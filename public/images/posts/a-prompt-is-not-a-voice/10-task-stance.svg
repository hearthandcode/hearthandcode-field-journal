<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="638" viewBox="0 0 1280 638" role="img" aria-labelledby="title desc">
  <title id="title">Task stance in the private prompt register</title>
  <desc id="desc">Bar chart of seven stance rates, from 20.8 percent reflective frames to 45.6 percent deontic requirement.</desc>
  <rect width="100%" height="100%" fill="#fbf8f2"/>
  <style>
    .title { font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif; font-size: 31px; font-weight: 700; fill: #1d2730; }
    .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #5c6871; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #1d2730; }
    .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #5c6871; }
    .value { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1d2730; }
    .note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #5c6871; }
    .flow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 650; fill: #1d2730; }
  </style>
  <text x="42" y="52" class="title">Task stance in the private prompt register</text>
  <text x="42" y="79" class="subtitle">Rate of policy-permitted prompts with at least one configured signal. Categories overlap.</text>
  <text x="42" y="132" class="label">Deontic requirement</text>
  <rect x="495" y="117" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="117" width="282.472" height="22" rx="11" fill="#9c513a"/>
  <text x="1170" y="134" class="value" text-anchor="end">45.6%</text>
  <text x="495" y="160" class="small">738 prompts</text>
  <text x="42" y="191" class="label">Evidentiary orientation</text>
  <rect x="495" y="176" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="176" width="280.922" height="22" rx="11" fill="#3e697e"/>
  <text x="1170" y="193" class="value" text-anchor="end">45.3%</text>
  <text x="495" y="219" class="small">734 prompts</text>
  <text x="42" y="250" class="label">Conditional reasoning</text>
  <rect x="495" y="235" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="235" width="276.706" height="22" rx="11" fill="#6d795b"/>
  <text x="1170" y="252" class="value" text-anchor="end">44.6%</text>
  <text x="495" y="278" class="small">723 prompts</text>
  <text x="42" y="309" class="label">Epistemic uncertainty</text>
  <rect x="495" y="294" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="294" width="246.078" height="22" rx="11" fill="#b3862b"/>
  <text x="1170" y="311" class="value" text-anchor="end">39.7%</text>
  <text x="495" y="337" class="small">643 prompts</text>
  <text x="42" y="368" class="label">Negation or prohibition</text>
  <rect x="495" y="353" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="353" width="230.392" height="22" rx="11" fill="#6e3729"/>
  <text x="1170" y="370" class="value" text-anchor="end">37.2%</text>
  <text x="495" y="396" class="small">602 prompts</text>
  <text x="42" y="427" class="label">Artifact orientation</text>
  <rect x="495" y="412" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="412" width="191.766" height="22" rx="11" fill="#274856"/>
  <text x="1170" y="429" class="value" text-anchor="end">30.9%</text>
  <text x="495" y="455" class="small">501 prompts</text>
  <text x="42" y="486" class="label">Reflective frame</text>
  <rect x="495" y="471" width="620" height="22" rx="11" fill="#f1ece3"/>
  <rect x="495" y="471" width="128.960" height="22" rx="11" fill="#6d795b"/>
  <text x="1170" y="488" class="value" text-anchor="end">20.8%</text>
  <text x="495" y="514" class="small">337 prompts</text>
  <line x1="42" y1="574" x2="1238" y2="574" stroke="#d8d1c5"/>
  <text x="42" y="590" class="note">Source: strict local topic-and-stance aggregate, 1,620 policy-permitted prompts.</text>
  <text x="42" y="609" class="note">Task wording only. These measures are not sentiment, emotional state, or task outcome.</text>
</svg>
