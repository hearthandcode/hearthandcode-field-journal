<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">A local, non-retrieval topic-analysis boundary</title>
  <desc id="desc">A flow diagram showing strict screening, configured domains, stance measures, screened TF-IDF and NMF, aggregate receipt, review-only vocabulary, and a blocked RAG or remote-model branch.</desc>
  <rect width="100%" height="100%" fill="#fbf8f2"/>
  <style>
    .title { font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif; font-size: 31px; font-weight: 700; fill: #1d2730; }
    .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #5c6871; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #1d2730; }
    .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #5c6871; }
    .value { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1d2730; }
    .note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #5c6871; }
    .flow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 650; fill: #1d2730; }
  </style>
  <text x="42" y="52" class="title">A local, non-retrieval topic-analysis boundary</text>
  <text x="42" y="79" class="subtitle">The analysis creates controlled aggregate artifacts, not a semantic-search system for private prompts.</text>
  <rect x="250" y="120" width="780" height="64" rx="10" fill="#f1ece3" stroke="#3e697e" stroke-width="3"/>
  <circle cx="286" cy="152" r="18" fill="#3e697e"/>
  <text x="286" y="158" class="value" text-anchor="middle">1</text>
  <text x="327" y="159" class="flow">Strict whole-prompt screen</text>
  <path d="M 640.0 187 L 640.0 199" stroke="#5c6871" stroke-width="2" fill="none"/>
  <path d="M 635.0 195 L 640.0 200 L 645.0 195" stroke="#5c6871" stroke-width="2" fill="none"/>
  <rect x="250" y="203" width="780" height="64" rx="10" fill="#f1ece3" stroke="#6d795b" stroke-width="3"/>
  <circle cx="286" cy="235" r="18" fill="#6d795b"/>
  <text x="286" y="241" class="value" text-anchor="middle">2</text>
  <text x="327" y="242" class="flow">Configured domains and task stance</text>
  <path d="M 640.0 270 L 640.0 282" stroke="#5c6871" stroke-width="2" fill="none"/>
  <path d="M 635.0 278 L 640.0 283 L 645.0 278" stroke="#5c6871" stroke-width="2" fill="none"/>
  <rect x="250" y="286" width="780" height="64" rx="10" fill="#f1ece3" stroke="#b3862b" stroke-width="3"/>
  <circle cx="286" cy="318" r="18" fill="#b3862b"/>
  <text x="286" y="324" class="value" text-anchor="middle">3</text>
  <text x="327" y="325" class="flow">Screened TF-IDF and local NMF</text>
  <path d="M 640.0 353 L 640.0 365" stroke="#5c6871" stroke-width="2" fill="none"/>
  <path d="M 635.0 361 L 640.0 366 L 645.0 361" stroke="#5c6871" stroke-width="2" fill="none"/>
  <rect x="250" y="369" width="780" height="64" rx="10" fill="#f1ece3" stroke="#9c513a" stroke-width="3"/>
  <circle cx="286" cy="401" r="18" fill="#9c513a"/>
  <text x="286" y="407" class="value" text-anchor="middle">4</text>
  <text x="327" y="408" class="flow">Aggregate receipt</text>
  <path d="M 640.0 436 L 640.0 448" stroke="#5c6871" stroke-width="2" fill="none"/>
  <path d="M 635.0 444 L 640.0 449 L 645.0 444" stroke="#5c6871" stroke-width="2" fill="none"/>
  <rect x="250" y="452" width="780" height="64" rx="10" fill="#f1ece3" stroke="#274856" stroke-width="3"/>
  <circle cx="286" cy="484" r="18" fill="#274856"/>
  <text x="286" y="490" class="value" text-anchor="middle">5</text>
  <text x="327" y="491" class="flow">Review-only vocabulary packet</text>
  <path d="M 640.0 519 L 640.0 531" stroke="#5c6871" stroke-width="2" fill="none"/>
  <path d="M 635.0 527 L 640.0 532 L 645.0 527" stroke="#5c6871" stroke-width="2" fill="none"/>
  <rect x="250" y="535" width="780" height="64" rx="10" fill="#f1ece3" stroke="#6d795b" stroke-width="3"/>
  <circle cx="286" cy="567" r="18" fill="#6d795b"/>
  <text x="286" y="573" class="value" text-anchor="middle">6</text>
  <text x="327" y="574" class="flow">Public derivative after review</text>
  <rect x="55" y="373" width="150" height="94" rx="10" fill="#f6e5df" stroke="#6e3729" stroke-width="2"/>
  <text x="130" y="403" class="value" text-anchor="middle">Blocked</text>
  <text x="130" y="426" class="small" text-anchor="middle">remote model</text>
  <text x="130" y="445" class="small" text-anchor="middle">or RAG index</text>
  <path d="M 205 420 L 245 420" stroke="#6e3729" stroke-width="3"/>
  <path d="M 222 407 L 232 433 M 232 407 L 222 433" stroke="#6e3729" stroke-width="3"/>
  <line x1="42" y1="716" x2="1238" y2="716" stroke="#d8d1c5"/>
  <text x="42" y="732" class="note">Source: 06-topic-stance-and-public-derivative-analysis-plan.md.</text>
  <text x="42" y="751" class="note">A boundary diagram, not a claim that local processing is risk free.</text>
</svg>
