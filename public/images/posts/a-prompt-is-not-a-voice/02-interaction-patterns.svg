<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="607" viewBox="0 0 1280 607" role="img" aria-labelledby="title desc">
  <title id="title">Interaction-pattern signals in the private prompt register</title>
  <desc id="desc">Horizontal bar chart of six overlapping interaction patterns across 1,914 sanitized prompts: question-led 68.9%, artifact-oriented 42.7%, verification-oriented 39.8%, constraint-setting 28.7%, provenance-oriented 27.3%, and revision-oriented 23.1%.</desc>
  <rect width="100%" height="100%" fill="#fbf8f2"/>
  <style>
    .title { font-family: ui-serif, Georgia, Cambria, 'Times New Roman', serif; font-size: 31px; font-weight: 700; fill: #1d2730; }
    .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #5c6871; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; fill: #1d2730; }
    .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #5c6871; }
    .value { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; fill: #1d2730; }
    .note { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #5c6871; }
    .flow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 650; fill: #1d2730; }
  </style>
  <text x="42" y="52" class="title">Interaction-pattern signals in the private prompt register</text>
  <text x="42" y="79" class="subtitle">Rate of prompts with at least one configured signal. Categories overlap.</text>
  <text x="42" y="132" class="label">Question-led language</text>
  <rect x="470" y="117" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="117" width="447.850" height="22" rx="11" fill="#9c513a"/>
  <text x="1160" y="134" class="value" text-anchor="end">68.9%</text>
  <text x="470" y="160" class="small">1,319 prompts</text>
  <text x="42" y="194" class="label">Artifact-oriented language</text>
  <rect x="470" y="179" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="179" width="277.550" height="22" rx="11" fill="#3e697e"/>
  <text x="1160" y="196" class="value" text-anchor="end">42.7%</text>
  <text x="470" y="222" class="small">818 prompts</text>
  <text x="42" y="256" class="label">Verification-oriented language</text>
  <rect x="470" y="241" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="241" width="258.700" height="22" rx="11" fill="#6d795b"/>
  <text x="1160" y="258" class="value" text-anchor="end">39.8%</text>
  <text x="470" y="284" class="small">761 prompts</text>
  <text x="42" y="318" class="label">Constraint-setting language</text>
  <rect x="470" y="303" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="303" width="186.550" height="22" rx="11" fill="#b3862b"/>
  <text x="1160" y="320" class="value" text-anchor="end">28.7%</text>
  <text x="470" y="346" class="small">549 prompts</text>
  <text x="42" y="380" class="label">Provenance-oriented language</text>
  <rect x="470" y="365" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="365" width="177.450" height="22" rx="11" fill="#6e3729"/>
  <text x="1160" y="382" class="value" text-anchor="end">27.3%</text>
  <text x="470" y="408" class="small">522 prompts</text>
  <text x="42" y="442" class="label">Revision-oriented language</text>
  <rect x="470" y="427" width="650" height="22" rx="11" fill="#f1ece3"/>
  <rect x="470" y="427" width="150.150" height="22" rx="11" fill="#274856"/>
  <text x="1160" y="444" class="value" text-anchor="end">23.1%</text>
  <text x="470" y="470" class="small">442 prompts</text>
  <line x1="42" y1="543" x2="1238" y2="543" stroke="#d8d1c5"/>
  <text x="42" y="559" class="note">Reviewed internal research artifact: de-identified local prompting-pattern analysis</text>
  <text x="42" y="578" class="note">Vocabulary recurrence does not establish task outcome, rigor, or effectiveness.</text>
</svg>
